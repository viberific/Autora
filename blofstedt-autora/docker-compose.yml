version: "3.7"

services:
  # Umbrel's reverse proxy. APP_HOST follows <app-id>_<service-name>_1.
  app_proxy:
    environment:
      APP_HOST: blofstedt-autora_app_1
      APP_PORT: 8817

  app:
    # The release's own build, by version, never :latest. The image workflow
    # sets this tag, and `version` in umbrel-app.yml, only once that
    # version's image is in the registry (.github/scripts/offer_release.py),
    # so Umbrel never offers an update whose image is still building. Don't
    # change it by hand; check_release.py fails a pull request that does.
    image: ghcr.io/viberific/autora:0.9.301
    # Not on-failure: a stop from inside the container -- the agent killing or
    # restarting the server it runs in -- exits cleanly with 0, which
    # on-failure takes as "leave it down", and the app then refuses every
    # connection until somebody restarts it by hand.
    restart: unless-stopped
    # A real init as PID 1 (Docker's docker-init, a tini build), in front of
    # `node dist/server.cjs`.
    #
    # Without it node itself is PID 1, and node does not wait() on children it
    # did not spawn: every process reparented to it -- the members of a killed
    # terminal command's process group, a chromium renderer whose browser exits
    # first -- stays a zombie for the life of the container. On 2026-10-18 the
    # box had 8972 of them against a limit of 9124 and every fork-based tool
    # failed with "Resource temporarily unavailable". An init reaps them as
    # they exit, which is the only thing that can: a zombie cannot be killed,
    # only collected by its parent. It also forwards SIGTERM to node, so a stop
    # reaches the server's own shutdown instead of waiting for the kill.
    init: true
    # Keep the app from taking the whole box: 3 GiB of memory and no swap
    # (memswap_limit equal to mem_limit), on a box with 8 GiB of which about
    # half is already in use. Past the cap the container is stopped and
    # restarted (restart: unless-stopped) instead of the host swapping itself
    # to a standstill, as it did on 2026-10-15 when the app peaked at 4.6 GB.
    # umbreld copies every service key except app_proxy into
    # docker-compose.umbreld.yml.
    mem_limit: 3g
    memswap_limit: 3g
    # The https listener, published directly rather than through app_proxy,
    # because the proxy speaks http to the backend and the browser needs the
    # certificate to be the one it is talking to.
    ports:
      - "8818:8818"
    volumes:
      # The only directory that survives an update: the settings file, the
      # API keys saved from the panel and the spend ledger behind the billing
      # card all live here. AUTORA_HOME points at it from the image.
      - "${APP_DATA_DIR}/data:/data"
      # Full read-write access to the host filesystem so the agent can work
      # anywhere on the server, not just inside the container.
      - "/:/host:rw"
    environment:
      # Network
      AUTORA_HOST: "0.0.0.0"
      AUTORA_PORT: "8817"
      # Only Umbrel's proxy (the login) may connect to 8817. Every app on the
      # box shares Docker's network with this one, so without this any of
      # them could reach the port directly, past the login, and run commands
      # with the host's filesystem mounted. See server/peers.ts. Loopback
      # (the agent opening its own app) is always let in; the https port 8818
      # is not gated.
      AUTORA_TRUSTED_PEERS: "blofstedt-autora_app_proxy_1"
      # Off, and staying off, because the better answer costs one command.
      #
      # Dictation and live voice chat need a secure page -- browsers will not
      # open a microphone for http://<host>, whatever the site settings say.
      # Setting this to 1 gets you one: Autora serves https on 8818 with a
      # certificate it generates, and you click through a warning once per
      # device. It works, and it is the only option on a network with nothing
      # in front of it.
      #
      # But 8818 is published straight to the network, so unlike 8817 it does
      # not go through Umbrel's login -- and this app auto-approves everything
      # with the whole filesystem mounted. That is not a default to hand
      # somebody. A proxy with a real certificate is better on every count: no
      # warning at all, no second port, and the login still in front. On a
      # tailnet that is `tailscale serve --bg --https=8443 8817`, one line,
      # once -- not plain `tailscale serve`, whose port 443 is the one umbrelOS
      # needs for its own dashboard. See the README.
      AUTORA_TLS: "0"
      # Where the agent's commands start: the host's filesystem, mounted above.
      AUTORA_WORKDIR: "/host"
      # API keys — set these in ~/umbrel/app-data/blofstedt-autora/.env, or
      # paste them into Settings, which saves them under /data and so keeps
      # them across an update. A key set here wins nothing and loses nothing:
      # it is what the app falls back to when it has none of its own, and the
      # panel says which of the two is in force.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      DEEPGRAM_API_KEY: "${DEEPGRAM_API_KEY:-}"
      ASSEMBLYAI_API_KEY: "${ASSEMBLYAI_API_KEY:-}"
