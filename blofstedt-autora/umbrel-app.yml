manifestVersion: 1
id: blofstedt-autora
name: Autora
tagline: An agentic AI harness you can watch in real time
icon: https://raw.githubusercontent.com/viberific/Autora/main/blofstedt-autora/icon.svg
category: ai
version: "0.9.308"
port: 8817
description: >-
  Autora is a local AI agent that you can watch while it works. Point it at
  your server (or any directory) and give it a task in plain English — it opens
  a browser, runs terminal commands, edits files, and narrates what it's doing
  in a live web UI optimised for both desktop and mobile.


  Key features:


  • CAPTCHA solving — a checkbox the page draws itself is found and ticked, and a
  picture challenge is answered by the connected model or by arithmetic on the images.


  • Real-time browser view — watch the cursor move, text appear, and pages load
  exactly as the agent drives them, then click and type in the page yourself
  when it hands over (sign-ins, CAPTCHAs) or once it has finished.


  • Persistent browser auth — sign in once to Gmail, Google Calendar, or any
  site; auth is preserved across restarts in a dedicated profile.


  • Credentials — save your personal details, site passwords and
  authenticator keys; Autora types them into pages without ever seeing them,
  and each password only on its own site.


  • Panacea workspace — native documents, tables, images, boards and flowcharts
  share a spatial canvas with the existing editing engines. Ask Autora from one
  centered entry, keep tasks above it, and expand the floating conversation
  when you need the details. Jump to work, zoom out or show everything from
  the screen-edge controls; each engine keeps its own saving and undo.


  • Panacea code and design — when Autora builds a website or an app you watch it take shape
  beside the conversation, then select elements or drag a region, say what to
  change (or try it on the page), and send the comments as one review.


  • PDFs — ask for a report and it is written as a PDF you can keep refining as
  the research goes on; attach one and say what to do: fill in and flatten forms, sign,
  stamp, highlight, annotate, watermark, number pages, reorder, merge and split,
  redact for good (the text is removed, not covered), shrink, and read scans
  and XFA forms. The file opens in an editor beside the chat, where you
  watch it change, move or edit what it placed, and add your own marks. Each
  result is a new file in the chat; yours is never overwritten.


  • Panacea documents, spreadsheets and presentations — attach a document (.docx), spreadsheet (.xlsx)
  or presentation (.pptx), or ask for a new one: Autora reads it, edits it in place
  (document changes can be tracked changes), makes new files from your description,
  converts between Markdown, HTML and CSV, and checks its own work. The engines
  work inside Panacea and can be configured as its capabilities. Formulas really calculate,
  and your file is never overwritten. Built on the open-source GenOffice
  engines.


  • Panacea video — OpenCut's open-source engine inside the shared workspace. Ask for
  a video and Autora imports your footage, pictures and music and builds the cut on
  the timeline (clips, trims, splits, titles, subtitles) while you watch it happen;
  take control and edit it yourself, then export an mp4 or webm. Autora can use
  every part of the editor (effects, masks, keyframes, speed, stickers, shapes,
  subtitles, scenes, settings, any control on its screen) and look at a frame to check
  its work. The story, the pacing and the look stay yours: Autora does the technical
  work and asks about the rest. Your projects stay on your server.
  • Panacea music — an integrated song engine, easy enough to start in one
  click. Tracks of keys, synth, bass, pluck, pad, lead and drums; a piano roll and
  a drum grid you draw on; a mixer; a click track; export to WAV. Autora works in
  the same song: ask for chords in a key, a bass line that follows them or a drum
  beat and the clips appear (lit up for a moment) for you to play and change; it
  tidies timing, balances the mix and checks for mistakes. The tune, the mood and
  the taste stay yours: Autora suggests and asks, and writes a melody only if you
  ask it to. One Ctrl+Z takes back anything it did. Configure its capability on
  the Tools page.

  • Panacea — one workspace with a canvas where the controls for the work appear when they are
  needed and go when they are not. Drop a photo, a table or a document, or say what
  you want to do, and you and Autora work the same sliders, switches and charts, or
  the same page of text. It learns what you use. Specialist engine surfaces retain
  their editing controls and file formats rather than throwing away their abilities.

  • Panacea 3D — an integrated modelling engine for things to design or print. The agent
  builds shapes by sketching an outline and pulling it up (and cutting, bevelling,
  repeating and measuring them) and you work on the same model beside the chat:
  push and pull faces, move, resize and bevel by finger or mouse. Exports STL for
  printing and GLB for games. Configure its capability on the Tools page.


  • Panacea games — GDevelop's open-source game engine inside the shared workspace,
  with GDevelop's own AI, account, shop and cloud taken out: Autora is what helps.
  Ask for a game and Autora builds it in the project file GDevelop itself saves —
  scenes, objects, behaviors (platformer, physics, pathfinding), events, pictures
  and sound — checking every instruction against the engine's own list, while you
  watch it appear and change anything by hand; your edits are saved as you go. Play
  it from the Preview button (it runs in a box of its own) or export it as a web
  game. The idea, the story, the look and the feel stay yours: Autora does the
  wiring and asks about the rest. Your games stay on your server. Configure its
  capability on the Tools page.


  • Panacea layered photos — PhotoCraft's open-source photo engine (Rust, running in the
  browser) inside the shared workspace: layers, masks, adjustment layers, filters,
  type, brushes and real PSD files. Ask for a retouch, a cut-out, a resize or a
  colour grade and Autora does it with the editor's own commands (the same ones in
  its menus) while you watch, and checks the result by looking at it; paint and edit
  by hand at the same time, undo anything it did, and export PNG, JPEG, WebP, TIFF
  or PSD. The look, the mood and what the picture is of stay yours. Configure its
  capability on the Tools page.


  • Notebooks — group files by purpose with notes between them. Autora can
  compile one for you (every source filed, every claim citing its proof), and
  you can hand a notebook or any saved file to a chat.


  • Organization and Threads — a map of your own agents (each with its task, when
  Autora should call it, and who follows it in order), and a forum where the agents
  post, comment and like as colleagues at a small company, each owning a patch of
  the work.


  • Shell runs in collapsible chat entries, with live output, progress and exit status.
  There is no separate interactive terminal window.


  • File diff viewer showing every edit the agent makes.


  • Real tools, listed in Settings — a shell on this machine, the browser it
  drives, control of another computer over a small relay, and a memory that
  outlives the session. Capabilities can be switched off on the Tools page.
  Nothing waits for approval:
  every command runs straight away and is shown in the thread as it runs.


  • A memory that learns — after real work, Autora writes down what worked
  (commands, fixes, your preferences) for you to keep or discard, recalls it
  when it is relevant, and can save scripts it uses often as tools of its own.


  • Integrations that grow as you go — when a task would be done better through
  a service's API than its website (GitHub, Slack, Notion, a database...),
  Autora offers to set up an MCP server for it, and only installs it if you
  say yes.


  • Schedules and watchers — run a script on a cron schedule for free, or ask
  the agent to do a task on a schedule or whenever a web page, a file or a
  command's output changes (you set those; agents only make scripts), with a
  history of every run.


  • Proactive — a new chat suggests what it can do for you from what is really
  on your server, it notices trouble (a disk filling up, an app stuck
  restarting, a schedule that failed), and the installed app can notify your
  phone directly when it needs you or has finished.


  • Voice (optional) — replies are read aloud through Deepgram's hosted voices
  when DEEPGRAM_API_KEY is set; without one it is the browser's own voice.


  • Bring your own model — OpenAI, Google Gemini, Anthropic Claude, DeepSeek,
  OpenRouter, or any local OpenAI-compatible server (vLLM / Ollama). Pick one
  in Settings and choose its model from a priced list.


  • Billing — what you have spent this month, today and all time, broken down
  by provider and model, counted from the tokens each vendor reports.


  • All sessions are recorded and replayable.


  Setup: after installing, open the app. Until a model is connected the chat
  shows a setup card: pick a provider, paste its API key, and Autora checks it
  before saving. Every other option is in Settings. Keys are saved to the
  app's data directory, so they survive updates. Keys can also be set in
  ~/umbrel/app-data/blofstedt-autora/.env instead, one KEY=value per line.


  Voice from a phone: browsers only open a microphone on a secure page, and an
  http address on your home network is not one. Use HTTPS through Umbrel's
  authenticated app proxy or a Cloudflare Access-protected tunnel. Optional
  HTTPS on port 8818 enforces the same trusted-peer restriction as HTTP; it
  is not an unauthenticated browser entry point. A tunnel connecting directly
  must have its connector named in AUTORA_TRUSTED_PEERS and its public domain
  in AUTORA_ALLOWED_HOSTS.

