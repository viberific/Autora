releaseNotes: >-
  Autora loads again through its Cloudflare Tunnel hostname,
  autora.049993.xyz. The Cloudflare Tunnel app's connector is now a trusted
  peer and the hostname is allowed, so a tunnel routed to
  http://blofstedt-autora_app_1:8817 reaches the app instead of being dropped.
  Keep a Cloudflare Access policy on that hostname, since the tunnel does not
  pass through Umbrel's login.
