version: "3.7"

services:
  # Umbrel's reverse proxy. APP_HOST follows <app-id>_<service-name>_1.
  app_proxy:
    environment:
      APP_HOST: blofstedt-flix_app_1
      APP_PORT: 8096
      # Flix has its own accounts, sign-in links and profile PINs, so Umbrel's
      # own login is not put in front of it (that made everyone sign in twice).
      # Only safe while Flix is reachable from the home network and Tailscale
      # alone: do not publish it with a port forward or Tailscale Funnel.
      PROXY_AUTH_ADD: "false"

  app:
    # Built by viberific/Flix's own workflow from the repo's package.json
    # version. Bump this tag (and `version` above) only once that tag exists
    # in the registry, or an update will fail with "manifest unknown".
    image: ghcr.io/viberific/flix:0.3.65
    restart: unless-stopped
    # The GPU, for Quick Sync, is granted by umbrelOS, not here: it strips a
    # hand-written `devices: /dev/dri` when it patches this file at install
    # time (so this container never saw the GPU), and adds the device node
    # back -- with the render and video groups that own it -- only because
    # umbrel-app.yml asks for the GPU permission. Flix probes the encoder on
    # its first conversion and falls back to x264 on its own if it cannot
    # open a session.
    # The torrent peer port. Flix keeps qBittorrent on 6881 (QB_LISTEN_PORT)
    # so it never changes between restarts, and this publishes it so a port
    # forward on the router actually reaches it. TCP and UDP both: peers
    # arrive on either. If 6881 is taken on the box, change the number on the
    # left here and set QB_LISTEN_PORT to the same number above.
    ports:
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      # The one address Flix will answer on. Every other host name it is
      # reached by -- Umbrel's own app-proxy port above all -- gets a 308 here,
      # because Umbrel's certificate covers umbrel.local only and so warns on
      # the tailnet name. This is the Tailscale Serve route on :9443, which
      # holds a real Let's Encrypt certificate for it. Leave empty to serve
      # whatever address arrives. See the app's README.
      PUBLIC_URL: "https://umbrel-1.tail16900.ts.net:9443"
      # Where the box is on the home network, with no certificate and no
      # proxy in the way. A Chromecast or Google TV fetches the video itself
      # and cannot reach the tailnet name, so the player hands it this instead.
      # If the router gives the box a new address, change this line to match
      # (Settings > Network in umbrelOS shows it); casting is the only thing
      # that uses it. Empty means the Cast button never appears.
      LAN_URL: "http://10.0.0.247:8096"
      # Deletion policy: "delete on release" is off. A finished, fully seeded
      # download is held -- still seeding, still counted -- and deleted only when
      # the Downloads volume actually runs short: below PRUNE_FREE_PCT the oldest
      # deletable ones go, one at a time, until PRUNE_TARGET_PCT is free again.
      # 5% of the 6.4 TB pool is about 320 GB, so this fires when the pool is
      # nearly full, not while there is plenty of room.
      PRUNE_FREE_PCT: "5"
      PRUNE_TARGET_PCT: "10"
      # Flix refuses new downloads below MIN_FREE_PCT, so that floor has to sit
      # under the prune trigger or the trigger is unreachable: with the floor at
      # 10, downloads alone can never take free space down to 5% for the prune to
      # see it. At 4 the cleanup acts first and the refusal stays the backstop.
      MIN_FREE_PCT: "4"
    volumes:
      # The sqlite database (users, library, saved keys), an optional .env
      # and qBittorrent's config — everything that survives an update.
      - "${APP_DATA_DIR}/data:/data"
      # The media, shared by qBittorrent (writes) and Flix (streams). Must be
      # the same path inside the container for both, which it is: /downloads.
      # It is Umbrel's own Downloads folder, so everything Flix fetches shows
      # up in the Files app next to anything else you download. UmbrelOS will
      # not let an app move or rename the folder it was given this way. What
      # Flix removes is chosen by the policy above, and only files of torrents it
      # downloaded itself.
      - "${UMBREL_ROOT}/home/Downloads:/downloads"
