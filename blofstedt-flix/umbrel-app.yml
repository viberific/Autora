gallery: []
releaseNotes: >-
  Sound, without refusing the episode. 0.3.54 fixed the silence by sending any file
  whose audio the browser cannot decode to a whole-file MP4 repack -- and that repack
  is capped at 1080p, needs the episode complete, and answers "this file would need
  converting" until the copy is ready. Every AMZN WEB-DL here is E-AC-3, so every
  episode was refused instead.

  The sound is the only part that cannot be passed through: no browser decodes
  E-AC-3. The picture can. A file in that position now plays as a stream with the
  picture copied byte for byte and only the audio encoded to AAC, so it starts at
  once, at whatever height it is, with nothing left duplicated on the disk. A
  finished episode still prefers the single repacked file, because one file seeks the
  whole episode at once.

  What this costs: while such an episode plays, a few percent of one core is spent
  encoding its audio. The picture is never re-encoded.
