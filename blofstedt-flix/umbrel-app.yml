gallery: []
releaseNotes: >-
  Flix no longer downloads anything it would have to convert. A release whose
  picture needs re-encoding is not a candidate at all, so the box never spends CPU
  on a file it fetched itself: it takes the copy-playable release instead (a 720p
  H.264 over a better-seeded 1080p HEVC), and 4K is never downloaded. The picker
  is not the only gate -- a play, a season pack and the next-episode warm-up all
  refuse one too.

  The library follows the same rule: a show or film with nothing that plays
  without converting is left out of the library, search and the home screen, so a
  poster never leads to a dead end. Against this library that is 17 shows of 592.
  Anything already on disk stays visible, and an episode with no playable release
  is simply absent rather than a tile that fails.

  A film or episode that still needs a conversion does not fail silently: the player
  says so in plain words and lets you allow one conversion for that episode, and an
  MKV that only needs its container changed plays as it always did.

  Updates download in a few seconds from now on. Every previous release re-fetched
  the whole dependency layer (about 95 MB) because npm writes the install time into
  every file it creates, so the layer never matched the one already on disk. That is
  fixed: from this version on, an update fetches only what actually changed.

  Settings > Playback still has the switch: untick "Never convert the picture" and
  conversions are allowed again, with the old preference for the sharpest release.

