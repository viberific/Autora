releaseNotes: >-
  Playback that recovers, seeks, resumes and moves on. Leaving an episode now releases
  its <video> element properly: a detached one kept its decoder and its open request,
  and a few of those left the next episode unable to play until the app was force-closed.
  On Android TV the Back button and an open list behave as they should, and the controls
  bar no longer sticks because a tapped button kept the focus.

  Seeking is the probed length on a streamed episode instead of an estimate, so the bar
  matches the file. Captions are one held choice and every other track is forced off.
  The volume slider is gone -- the TV and the phone set the volume.

  Up next passes on sooner (the last 3.5% instead of 8%, 25-60 seconds), an episode that
  moves on is marked watched first, and leaving during the credits still counts.
