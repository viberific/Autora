manifestVersion: 1
id: blofstedt-flix
name: Flix
tagline: Your own streaming service, sourced straight from BTN
icon: https://raw.githubusercontent.com/viberific/Autora/main/blofstedt-flix/icon.svg
category: media
version: "0.3.46"
port: 8096
folderAccess:
  - id: umbrel-downloads
    name: Downloads
    note: Torrents are saved in Umbrel's shared Downloads folder, so everything
      Flix fetches shows up in the Files app. Available in Flix at /downloads.
    mounts:
      - service: app
        targetPath: /downloads
description: >-
  Flix is a private, Jellyfin-style media server whose only source is
  BroadcasTheNet. Search BTN's catalog, pick a show, press play — Flix starts a
  sequential torrent download in the bundled qBittorrent and begins streaming
  the file as its pieces arrive, remuxing or transcoding to HLS when the
  browser can't play the original format. It is an installable PWA: add it to
  your phone's home screen and it behaves like an app. Everyone in the family
  has their own profile, watch history, My List and content-rating limits.


  Everything runs in one container: the app, qBittorrent-nox (BTN only allows
  whitelisted clients) and ffmpeg. Seeding follows BTN's rule — 130 hours or a
  1:1 ratio — and is not configurable.


  Setup: open Flix and create your admin account — the first account made
  becomes the administrator. The admin's Settings page is where the BTN API
  key goes in (with a Test connection button beside it), along with an
  optional TMDB key for automatic content ratings. Nothing has to be edited on
  disk and the app does not need restarting. The bundled qBittorrent is wired
  up already: its Web UI is bound to localhost inside the container, is never
  exposed, and needs no password.


  If you prefer files, the same settings can be given as environment
  variables in a .env in the app's data directory (BTN_API_KEY, TMDB_API_KEY,
  QB_URL, QB_USER, QB_PASS); what is set in the app's Settings takes
  precedence, and the app says which of the two each key came from.


  Your library, users and downloads live in the app's data directory and
  survive updates.
developer: blofstedt
website: https://github.com/viberific/Flix
submitter: blofstedt
submission: https://github.com/blofstedt/Autora
repo: https://github.com/viberific/Flix
support: https://github.com/viberific/Flix/issues
gallery: []
releaseNotes: >-
  This release switches off the background work that was decoding episodes. The
  previous version asked ffmpeg to measure where each file's credits start and to
  cut seek previews, and on a four-core box that pinned every core: the app could
  not load, artwork timed out, and posters fell back to flat coloured blocks. Both
  passes are gone, so nothing decodes in the background any more.

  Playback is direct only. A file that would need converting is now refused with a
  message rather than quietly converted, so the box never spends its evening
  encoding. Up next still appears when the credits start: from a chapter marker when
  the file has one, and from the runtime estimate otherwise.
