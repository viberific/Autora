releaseNotes: >-
  The wait for a slow episode is no longer a black screen. While its file is
  still downloading the player says how far it has got, how fast, from how many
  people and roughly how long is left, and after twenty seconds with nothing to
  play it says so plainly and offers a cancel. It also stopped quietly giving up
  and trying another source after twenty-five seconds, which could throw away a
  download that was working perfectly well - a two-seeder season pack taking
  hours is a wait, not a fault.
  On a show, "Ready to watch" now means that episode's own file is fully on
  disk: before that it shows how far the download has got, and an episode in a
  season pack that nobody has asked for says it is waiting in the pack.
  The next episode of a season pack starts fetching once the one you are
  watching holds enough of itself to play for forty minutes, so the handover is
  ready instead of cold. The Torrents page and the storage graph count the
  episodes you asked for rather than the whole pack, so a 38 GB season with one
  6.25 GB episode selected reads as 6.25 GB.
